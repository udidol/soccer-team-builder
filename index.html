<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Soccer Team Builder</title>
</head>
<body>
  <div class="field-container">
    <div class="field">
      <div class="penalty-box penalty-box--top"></div>
      <div class="midfield-line"></div>
      <!-- Row 1: ST -->
      <div class="position-slot" data-slot="ST" data-positions="ST,LW,RW">
        <select id="slot-st" placeholder="ST"><option value=""></option></select>
      </div>

      <!-- Row 2: LW, RW -->
      <div class="position-slot" data-slot="LW" data-positions="LW,LM,ST">
        <select id="slot-lw" placeholder="LW"><option value=""></option></select>
      </div>
      <div class="position-slot" data-slot="RW" data-positions="RW,RM,ST">
        <select id="slot-rw" placeholder="RW"><option value=""></option></select>
      </div>

      <!-- Row 3: CM x3 -->
      <div class="position-slot" data-slot="LCM" data-positions="CM,CDM,CAM,LM">
        <select id="slot-lcm" placeholder="CM"><option value=""></option></select>
      </div>
      <div class="position-slot" data-slot="CM" data-positions="CM,CDM,CAM">
        <select id="slot-cm" placeholder="CM"><option value=""></option></select>
      </div>
      <div class="position-slot" data-slot="RCM" data-positions="CM,CDM,CAM,RM">
        <select id="slot-rcm" placeholder="CM"><option value=""></option></select>
      </div>

      <!-- Row 4: Defense -->
      <div class="position-slot" data-slot="LB" data-positions="LB">
        <select id="slot-lb" placeholder="LB"><option value=""></option></select>
      </div>
      <div class="position-slot" data-slot="LCB" data-positions="CB">
        <select id="slot-lcb" placeholder="CB"><option value=""></option></select>
      </div>
      <div class="position-slot" data-slot="RCB" data-positions="CB">
        <select id="slot-rcb" placeholder="CB"><option value=""></option></select>
      </div>
      <div class="position-slot" data-slot="RB" data-positions="RB">
        <select id="slot-rb" placeholder="RB"><option value=""></option></select>
      </div>

      <!-- Row 5: GK -->
      <div class="position-slot" data-slot="GK" data-positions="GK">
        <select id="slot-gk" placeholder="GK"><option value=""></option></select>
      </div>
    </div>
  </div>

  <script type="module" src="/src/main.ts"></script>
</body>
</html>
